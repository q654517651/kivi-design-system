<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIVI 高清放大面板原型</title>
<!-- 线上同款 iconfont（packages/shared/src/components/Icon/constants.ts），离线时图标不显示 -->
<link rel="stylesheet" href="https://at.alicdn.com/t/c/font_5024669_6fegzgl22ao.css">
<style>
/* ===== 设计变量：取自 ai-design-web/src/variable.less ===== */
:root {
  --font-size-sm: 12px;
  --font-size-md: 14px;
  --font-weight-regular: 400;
  --spacing-xxs: 4px;
  --spacing-xs: 6px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-lg: 16px;
  --border-radius-sm: 8px;
  --border-radius-md: 12px;
  --border-radius-lg: 16px;
  --border-radius-round: 999px;
  --white-100: #ffffff;
  --white-50: rgba(255, 255, 255, 0.5);
  --white-30: rgba(255, 255, 255, 0.3);
  --white-20: rgba(255, 255, 255, 0.2);
  --white-12: rgba(255, 255, 255, 0.12);
  --white-8: rgba(255, 255, 255, 0.08);
  --white-4: rgba(255, 255, 255, 0.04);
  --black-100: #000000;
  --black-40: rgba(0, 0, 0, 0.4);
  --color-brand-gradient-1: #ceff5d;
  --color-brand-gradient-2: #2bff75;
  --color-brand-solid: #2bff75;
  --color-border: var(--white-12);
  --color-text-fill-primary: var(--white-100);
  --color-text-fill-secondary: var(--white-50);
  --color-text-fill-placeholder: var(--white-30);
  --color-bg-fill-container-light-1: var(--white-8);
  --color-bg-fill-container-light-1-hover-active: var(--white-12);
  --color-bg-fill-container-light-2: var(--white-4);
  --color-bg-fill-popup-light-2: #2b2d31;
  --background: #05080a;
  --ic-panel-bg: #191b1d;
  --ic-panel-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
  --font: 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--background);
  color: var(--color-text-fill-primary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
button:focus-visible { outline: 2px solid rgba(43, 255, 117, 0.6); outline-offset: 2px; }
.iconfont {
  font-family: 'iconfont' !important;
  font-style: normal;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}

/* ===== 画布 ===== */
.ic-canvas {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background-color: var(--background);
  touch-action: none;
  user-select: none;
}
.ic-canvas.is-panning { cursor: grabbing; }
.ic-canvas.is-animating { transition: background-position 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
.ic-world {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
  will-change: transform;
}
.ic-world.is-animating { transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
.ic-lines {
  position: absolute;
  left: 0;
  top: 0;
  width: 1px;
  height: 1px;
  overflow: visible;
  pointer-events: none;
}
.ic-line { fill: none; stroke: #424242; stroke-width: 1.5; transition: stroke 0.2s; }
.ic-line.is-active { stroke: rgba(255, 255, 255, 0.55); stroke-width: 2; }
.ic-line.is-flowing {
  stroke: rgba(255, 255, 255, 0.9);
  stroke-dasharray: 6 6;
  animation: ic-line-flow 0.6s linear infinite;
}
@keyframes ic-line-flow { to { stroke-dashoffset: -12; } }

/* ===== 节点 ===== */
.ic-node {
  position: absolute;
  z-index: 1;
  border-radius: 16px;
  background: #181818;
}
.ic-node.is-selected { z-index: 20; }
.ic-node::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 10;
  border-radius: inherit;
  pointer-events: none;
  outline: 1px solid var(--color-border);
  outline-offset: -1px;
}
.ic-node.is-selected::after { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: -2px; }
.ic-node-card {
  position: absolute;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  border-radius: 16px;
  background: #181818;
}
.ic-node-img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
}
.ic-node-img.is-revealing { animation: ic-reveal 0.6s ease-out; }
@keyframes ic-reveal {
  from { filter: blur(8px) brightness(1.2); transform: scale(1.02); }
  to { filter: none; transform: none; }
}
.ic-node-title {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 28px;
  padding-bottom: 8px;
  transform: translateY(-100%);
  overflow: hidden;
  color: var(--color-text-fill-secondary);
  font-size: var(--font-size-md);
  line-height: 20px;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* 端口：左右中点外侧 */
.ic-port {
  position: absolute;
  top: 50%;
  width: 16px;
  height: 16px;
  margin-top: -8px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.2);
  opacity: 0;
  transition: opacity 0.2s linear, border-color 0.2s linear;
}
.ic-port--in { left: -26px; }
.ic-port--out { right: -26px; }
.ic-node:hover .ic-port,
.ic-node.is-selected .ic-port,
.ic-port.is-connected { opacity: 1; }
.ic-port.is-connected::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.2);
}

/* 生成中 loading（对应 node-loading-box） */
.ic-loading {
  position: absolute;
  inset: 0;
  z-index: 5;
  overflow: hidden;
  border-radius: 16px;
  transition: opacity 0.3s ease;
}
.ic-loading.is-leaving { opacity: 0; }
.ic-loading-cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ic-loading-mask {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.ic-loading-progress {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 0;
  overflow: hidden;
  animation: ic-loading-progress var(--ic-loading-duration, 5s) linear forwards;
}
.ic-loading-gradient {
  position: absolute;
  inset: 0;
  background: linear-gradient(270deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0) 100%);
}
.ic-loading-sweep {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 167px;
  background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.3) 56%, rgba(255, 255, 255, 0) 100%);
  animation: ic-sweep 1.5s linear infinite;
}
.ic-loading-countdown {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 10;
  display: flex;
  align-items: center;
  height: 32px;
  padding: 0 12px;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: #fff;
  font-size: 14px;
}
@keyframes ic-loading-progress { from { width: 0; } to { width: 100%; } }
@keyframes ic-sweep {
  from { transform: translateX(-167px); }
  to { transform: translateX(var(--ic-card-w, 300px)); }
}

/* ===== 节点内联浮层：顶部工具栏 / 底部面板（对应 TopbarInline / ActionPanelInline） ===== */
.ic-inline {
  position: absolute;
  left: 50%;
  z-index: 30;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s var(--ic-panel-ease);
}
.ic-inline.is-visible { opacity: 1; pointer-events: auto; }
.ic-inline--bottom {
  bottom: -12px;
  transform: translateX(-50%) translateY(100%) scale(var(--ic-inline-panel-scale, 1));
  transform-origin: center top;
}
.ic-inline--top {
  top: -40px;
  transform: translateX(-50%) translateY(-100%) scale(var(--ic-inline-panel-scale, 1));
  transform-origin: center bottom;
}
.ic-inline--bottom.is-visible { animation: ic-inline-panel-enter-bottom 0.2s var(--ic-panel-ease) backwards; }
.ic-inline--top.is-visible { animation: ic-inline-panel-enter-top 0.2s var(--ic-panel-ease) backwards; }
@keyframes ic-inline-panel-enter-bottom {
  from { transform: translateX(-50%) translateY(calc(100% + 8px)) scale(var(--ic-inline-panel-scale, 1)); }
  to { transform: translateX(-50%) translateY(100%) scale(var(--ic-inline-panel-scale, 1)); }
}
@keyframes ic-inline-panel-enter-top {
  from { transform: translateX(-50%) translateY(calc(-100% - 8px)) scale(var(--ic-inline-panel-scale, 1)); }
  to { transform: translateX(-50%) translateY(-100%) scale(var(--ic-inline-panel-scale, 1)); }
}

/* 顶部工具栏（对应 image/components/topbar-content.tsx） */
.ic-topbar {
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
  min-width: 120px;
  padding: var(--spacing-xs);
  white-space: nowrap;
  background: rgba(24, 24, 24, 0.7);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: var(--border-radius-md);
}
.ic-topbar-text,
.ic-topbar-icon {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  border: 0;
  border-radius: var(--border-radius-sm);
  background: transparent;
  color: var(--white-100);
  cursor: pointer;
  transition: background 0.15s ease;
}
.ic-topbar-text {
  gap: var(--spacing-sm);
  padding: var(--spacing-xs) var(--spacing-md);
  font-size: var(--font-size-md);
  line-height: 20px;
}
.ic-topbar-icon { justify-content: center; padding: var(--spacing-xs); }
.ic-topbar-text:hover,
.ic-topbar-icon:hover,
.ic-topbar-text.is-active { background: var(--color-bg-fill-container-light-1); }
.ic-topbar .iconfont { width: 20px; height: 20px; font-size: 20px; }
.ic-topbar-divider { flex-shrink: 0; width: 1px; height: 20px; background: rgba(255, 255, 255, 0.12); }

/* 高清放大面板（基于 image/components/image-enhancement-panel） */
.ic-upscale-panel {
  display: flex;
  width: 420px;
  padding: var(--spacing-lg);
  flex-direction: column;
  gap: var(--spacing-lg);
  border-radius: 12px;
  background: var(--ic-panel-bg);
  overflow: hidden;
}
.ic-row {
  display: flex;
  width: 100%;
  min-height: 32px;
  align-items: center;
  gap: var(--spacing-xxs);
}
.ic-label {
  color: var(--color-text-fill-primary);
  font-size: var(--font-size-md);
  font-weight: var(--font-weight-regular);
  white-space: nowrap;
}
.ic-options {
  display: flex;
  flex: 1 0 0;
  min-width: 0;
  align-items: center;
  justify-content: flex-end;
  gap: var(--spacing-xs);
}
.ic-option {
  display: flex;
  flex: 1 0 0;
  min-width: 0;
  min-height: 32px;
  padding: var(--spacing-xs) var(--spacing-lg);
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: var(--border-radius-sm);
  background: var(--color-bg-fill-container-light-2);
  color: var(--white-50);
  font-size: var(--font-size-md);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, opacity 0.15s ease;
}
.ic-option:hover:not(:disabled) { background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.8); }
.ic-option.is-active,
.ic-option.is-active:hover:not(:disabled) { background: var(--color-bg-fill-container-light-1-hover-active); color: var(--color-text-fill-primary); }
.ic-option:disabled { cursor: not-allowed; opacity: 0.5; }
.ic-row-end { display: flex; flex: 1 0 0; justify-content: flex-end; }

/* 开关（对应 packager-modal 内 VehicleSwitch） */
.ic-switch {
  position: relative;
  width: 36px;
  height: 20px;
  padding: 0;
  border: 0;
  border-radius: var(--border-radius-round);
  background: rgba(255, 255, 255, 0.12);
  cursor: pointer;
  transition: background 0.16s ease;
}
.ic-switch span {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.16s ease;
}
.ic-switch:hover:not(:disabled) { background: rgba(255, 255, 255, 0.2); }
.ic-switch[aria-checked='true'],
.ic-switch[aria-checked='true']:hover:not(:disabled) { background: var(--color-brand-solid); }
.ic-switch[aria-checked='true'] span { transform: translateX(16px); }
.ic-switch:disabled { cursor: not-allowed; opacity: 0.45; }

.ic-footer {
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-md);
}
.ic-cost { color: var(--color-text-fill-secondary); font-size: var(--font-size-sm); white-space: nowrap; }
.ic-cost em { font-style: normal; color: var(--color-text-fill-primary); }

/* 主按钮（对应 components/generate-btn） */
.ic-generate-btn {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-xxs);
  min-width: 64px;
  height: 36px;
  padding: 0 var(--spacing-lg);
  border: none;
  border-radius: var(--border-radius-sm);
  background: linear-gradient(90deg, var(--color-brand-gradient-1) 0%, var(--color-brand-gradient-2) 100%);
  color: var(--black-100);
  font-size: var(--font-size-md);
  font-weight: 600;
  cursor: pointer;
}
.ic-generate-btn:hover { opacity: 0.9; }
.ic-generate-btn:active { opacity: 0.8; }
.ic-generate-btn:disabled {
  opacity: 1;
  color: rgba(255, 255, 255, 0.2);
  background: var(--color-bg-fill-container-light-1);
  cursor: not-allowed;
}
.ic-generate-btn .iconfont { display: none; font-size: 16px; }
.ic-generate-btn.is-loading .iconfont { display: inline-flex; animation: ic-spin 1s linear infinite; }
@keyframes ic-spin { to { transform: rotate(360deg); } }

/* ===== 画布外层 UI ===== */
.ic-left-container {
  position: fixed;
  left: 24px;
  top: 14px;
  z-index: 400;
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
  padding: var(--spacing-sm) var(--border-radius-md) var(--spacing-sm) var(--border-radius-sm);
  border-radius: var(--border-radius-md);
  background: var(--ic-panel-bg);
  backdrop-filter: blur(6px);
}
.ic-home {
  display: flex;
  padding: 4px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: #fff;
  cursor: pointer;
}
.ic-home:hover { background: var(--white-8); }
.ic-home .iconfont { width: 20px; height: 20px; font-size: 20px; }
.ic-left-divider { flex-shrink: 0; width: 1px; height: 16px; background: rgba(255, 255, 255, 0.12); }
.ic-canvas-title { max-width: 140px; overflow: hidden; color: #fff; font-size: 14px; white-space: nowrap; text-overflow: ellipsis; }

.ic-left-toolbar {
  position: fixed;
  left: 24px;
  top: 50%;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: var(--spacing-lg) var(--spacing-md);
  transform: translateY(-50%);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--border-radius-round);
  background: var(--ic-panel-bg);
  backdrop-filter: blur(6px);
}
.ic-tool-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4px;
  border: 0;
  border-radius: var(--border-radius-sm);
  background: transparent;
  color: #fff;
  cursor: pointer;
}
.ic-tool-btn:hover { background: var(--color-bg-fill-container-light-1); }
.ic-tool-btn .iconfont { width: 24px; height: 24px; font-size: 24px; }

.ic-bottom-toolbar {
  position: fixed;
  left: 24px;
  bottom: 24px;
  z-index: 50;
  display: flex;
  align-items: center;
  height: 36px;
  padding: 0 var(--spacing-xs);
  gap: var(--spacing-xxs);
  border-radius: var(--border-radius-sm);
  background: var(--color-bg-fill-popup-light-2);
  backdrop-filter: blur(6px);
}
.ic-icon-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  padding: 4px;
  border: 0;
  border-radius: var(--border-radius-sm);
  background: transparent;
  color: rgba(255, 255, 255, 0.5);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}
.ic-icon-btn:hover { background: var(--color-bg-fill-container-light-1); color: rgba(255, 255, 255, 0.8); }
.ic-icon-btn .iconfont { width: 20px; height: 20px; font-size: 20px; }
.ic-zoom-group { display: flex; align-items: center; gap: 4px; }
.ic-zoom-value {
  min-width: 40px;
  color: var(--color-text-fill-secondary);
  font-size: var(--font-size-md);
  text-align: center;
  white-space: nowrap;
  user-select: none;
}

.ic-proto-hint {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 50;
  color: var(--color-text-fill-placeholder);
  font-size: 12px;
  pointer-events: none;
}

/* 提示气泡（对应 custom-tooltip） */
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip);
  position: absolute;
  z-index: 1000;
  display: flex;
  align-items: center;
  height: 44px;
  padding: 12px;
  border-radius: var(--border-radius-sm);
  background: var(--color-bg-fill-popup-light-2);
  color: #fff;
  font-size: 14px;
  font-weight: 400;
  line-height: 20px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease;
}
[data-tip]:hover::after { opacity: 1; transition-delay: 0.3s; }
[data-tip-pos='right']::after { left: calc(100% + 12px); top: 50%; transform: translateY(-50%); }
[data-tip-pos='top']::after { bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); }

/* 全局提示（antd message 暗色） */
.ic-toast-host {
  position: fixed;
  top: 8px;
  left: 0;
  right: 0;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}
.ic-toast {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border-radius: 8px;
  background: #1f1f1f;
  box-shadow: 0 6px 16px 0 rgba(0, 0, 0, 0.08), 0 3px 6px -4px rgba(0, 0, 0, 0.12), 0 9px 28px 8px rgba(0, 0, 0, 0.05);
  color: rgba(255, 255, 255, 0.85);
  font-size: 14px;
  line-height: 22px;
  animation: ic-toast-in 0.25s ease-out;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.ic-toast.is-leaving { opacity: 0; transform: translateY(-8px); }
.ic-toast svg { flex-shrink: 0; }
@keyframes ic-toast-in { from { opacity: 0; transform: translateY(-8px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<div id="canvas" class="ic-canvas" aria-label="无限画布">
  <div id="world" class="ic-world">
    <svg id="lines" class="ic-lines" aria-hidden="true"></svg>
  </div>
</div>

<!-- 左上：返回主页 + 画布名 -->
<div class="ic-left-container">
  <button class="ic-home" type="button" data-tip="返回主页" data-tip-pos="right" data-noop="返回主页"><span class="iconfont icon-kivi-Home"></span></button>
  <div class="ic-left-divider"></div>
  <div class="ic-canvas-title">未命名画布</div>
</div>

<!-- 左侧工具栏 -->
<div class="ic-left-toolbar">
  <button class="ic-tool-btn" type="button" data-tip="文本节点" data-tip-pos="right" data-noop="文本节点"><span class="iconfont icon-kivi-text"></span></button>
  <button class="ic-tool-btn" type="button" data-tip="图片节点" data-tip-pos="right" data-noop="图片节点"><span class="iconfont icon-kivi-ImageGeneration"></span></button>
  <button class="ic-tool-btn" type="button" data-tip="视频节点" data-tip-pos="right" data-noop="视频节点"><span class="iconfont icon-kivi-Video"></span></button>
  <button class="ic-tool-btn" type="button" data-tip="剪辑节点" data-tip-pos="right" data-noop="剪辑节点"><span class="iconfont icon-kivi-Cutting"></span></button>
  <button class="ic-tool-btn" type="button" data-tip="工作流" data-tip-pos="right" data-noop="工作流"><span class="iconfont icon-kivi-Template"></span></button>

  };
  // 预计消耗积分：需求给定 20，暂不区分倍数，改这里即可
  const UPSCALE_COST = { 2: 20, 4: 20 };
  // 原型模拟耗时（秒）
  const UPSCALE_SECONDS = { 2: 5, 4: 8 };
  const PORT_OFFSET = 18;
  const GRID_SIZE = 18;
  const MIN_ZOOM = 0.1;
  const MAX_ZOOM = 2;
  const MIN_COMPENSATED_ZOOM = 0.5;

  const $ = (selector, root = document) => root.querySelector(selector);
  const canvas = $('#canvas');
  const world = $('#world');
  const linesSvg = $('#lines');
  const zoomValue = $('#zoom-value');
  const toastHost = $('#toast-host');
  const topbarEl = $('#tpl-topbar').content.firstElementChild.cloneNode(true);
  const panelEl = $('#tpl-panel').content.firstElementChild.cloneNode(true);

  const state = {
    zoom: 1,
    pan: { x: 0, y: 0 },
    nodes: [],
    lines: [],
    selectedId: null,
    panelHidden: false,
    submitting: false,
    seq: 0,
  };

  const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
  const getNode = (id) => state.nodes.find((n) => n.id === id);
  const getSelected = () => getNode(state.selectedId);

  /* ---------- toast ---------- */
  const TOAST_ICONS = {
    success: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="#49aa19"/><path d="M4.6 8.2l2.2 2.2 4.6-4.8" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    info: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="8" fill="#A8A8A8"/><path d="M8 8V12" stroke="white" stroke-width="2" stroke-linecap="round"/><circle cx="8" cy="5" r="1" fill="white"/></svg>',
  };
  const toast = (type, text) => {
    const el = document.createElement('div');
    el.className = 'ic-toast';
    el.innerHTML = TOAST_ICONS[type];
    const span = document.createElement('span');
    span.textContent = text;
    el.appendChild(span);
    toastHost.appendChild(el);
    setTimeout(() => {
      el.classList.add('is-leaving');
      setTimeout(() => el.remove(), 260);
    }, 2400);
  };

  /* ---------- 视图 ---------- */
  const applyView = () => {
    const { zoom, pan } = state;
    world.style.transform = `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`;
    world.style.setProperty('--ic-inline-panel-scale', String(1 / Math.max(zoom, MIN_COMPENSATED_ZOOM)));
    const size = GRID_SIZE * zoom;
    const r = Math.min(1.5, zoom);
    canvas.style.backgroundImage = `radial-gradient(circle at ${r}px ${r}px, rgba(255,255,255,0.18) ${r}px, transparent ${r + 0.4}px)`;
    canvas.style.backgroundSize = `${size}px ${size}px`;
    canvas.style.backgroundPosition = `${pan.x}px ${pan.y}px`;
    zoomValue.textContent = `${Math.floor(zoom * 100)}%`;
  };

  const animateView = (mutate) => {
    world.classList.add('is-animating');
    canvas.classList.add('is-animating');
    mutate();
    applyView();
    clearTimeout(animateView.timer);
    animateView.timer = setTimeout(() => {
      world.classList.remove('is-animating');
      canvas.classList.remove('is-animating');
    }, 460);
  };

  const zoomAt = (nextZoom, cx, cy) => {
    const z = clamp(nextZoom, MIN_ZOOM, MAX_ZOOM);
    const wx = (cx - state.pan.x) / state.zoom;
    const wy = (cy - state.pan.y) / state.zoom;
    state.zoom = z;
    state.pan.x = cx - wx * z;
    state.pan.y = cy - wy * z;
  };

  const fitView = () => {
    const xs = state.nodes.flatMap((n) => [n.x, n.x + n.w]);
    const ys = state.nodes.flatMap((n) => [n.y - 28, n.y + n.h]);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const z = clamp(Math.min((innerWidth - 240) / (maxX - minX), (innerHeight - 240) / (maxY - minY)), MIN_ZOOM, 1);
    animateView(() => {
      state.zoom = z;
      state.pan.x = innerWidth / 2 - ((minX + maxX) / 2) * z;
      state.pan.y = innerHeight / 2 - ((minY + maxY) / 2) * z;
    });
  };

  const revealNode = (node) => {
    const m = 80;
    const z = state.zoom;
    const left = state.pan.x + (node.x - PORT_OFFSET) * z;
    const right = state.pan.x + (node.x + node.w + PORT_OFFSET) * z;
    const top = state.pan.y + (node.y - 28) * z;
    const bottom = state.pan.y + (node.y + node.h) * z;
    let dx = 0;
    let dy = 0;
    if (right > innerWidth - m) dx = innerWidth - m - right;
    else if (left < m + 80) dx = m + 80 - left;
    if (bottom > innerHeight - m) dy = innerHeight - m - bottom;
    else if (top < m) dy = m - top;
    if (dx || dy) animateView(() => { state.pan.x += dx; state.pan.y += dy; });
  };

  /* ---------- 节点 ---------- */
  const placeNode = (node) => {
    Object.assign(node.el.style, {
      left: `${node.x}px`,
      top: `${node.y}px`,
      width: `${node.w}px`,
      height: `${node.h}px`,
    });
  };

  const buildNodeEl = (node) => {
    const el = document.createElement('div');
    el.className = 'ic-node';
    el.dataset.id = node.id;
    el.innerHTML = `
      <div class="ic-node-title"></div>
      <div class="ic-node-card"><img class="ic-node-img" alt="" draggable="false"></div>
      ${node.ports.in ? '<div class="ic-port ic-port--in"></div>' : ''}
      ${node.ports.out ? '<div class="ic-port ic-port--out"></div>' : ''}`;
    $('.ic-node-title', el).textContent = node.title;
    $('.ic-node-img', el).src = node.src;
    return el;
  };

  const addNode = (data) => {
    const node = {
      id: `image_${++state.seq}`,
      status: 'done',
      ports: { in: false, out: true },
      upscale: { ratio: 2, face: false },
      ...data,
    };
    node.el = buildNodeEl(node);
    world.appendChild(node.el);
    state.nodes.push(node);
    placeNode(node);
    return node;
  };

  const renderLines = () => {
    linesSvg.innerHTML = state.lines
      .map(({ from, to }) => {
        const a = getNode(from);
        const b = getNode(to);
        const x1 = a.x + a.w + PORT_OFFSET;
        const y1 = a.y + a.h / 2;
        const x2 = b.x - PORT_OFFSET;
        const y2 = b.y + b.h / 2;
        const c = Math.max(Math.abs(x2 - x1) / 2, 40);
        const cls = [
          'ic-line',
          b.status === 'loading' ? 'is-flowing' : '',
          [a.id, b.id].includes(state.selectedId) ? 'is-active' : '',
        ].join(' ');
        return `<path class="${cls}" d="M${x1},${y1} C${x1 + c},${y1} ${x2 - c},${y2} ${x2},${y2}"/>`;
      })
      .join('');
    state.nodes.forEach((n) => {
      $('.ic-port--out', n.el)?.classList.toggle('is-connected', state.lines.some((l) => l.from === n.id));
      $('.ic-port--in', n.el)?.classList.toggle('is-connected', state.lines.some((l) => l.to === n.id));
    });
  };

  /* ---------- 选中 & 内联浮层 ---------- */
  const toggleInline = (el, visible) => {
    if (!visible) {
      el.classList.remove('is-visible');
      return;
    }
    if (el.classList.contains('is-visible')) return;
    void el.offsetWidth; // 重新触发入场动画
    el.classList.add('is-visible');
  };

  const syncPanel = () => {
    const node = getSelected();
    if (!node) return;
    const { ratio, face } = node.upscale;
    panelEl.querySelectorAll('.ic-option').forEach((btn) => {
      const active = Number(btn.dataset.ratio) === ratio;
      btn.classList.toggle('is-active', active);
      btn.setAttribute('aria-checked', String(active));
      btn.disabled = state.submitting;
    });
    const sw = $('.ic-switch', panelEl);
    sw.setAttribute('aria-checked', String(face));
    sw.disabled = state.submitting;
    $('[data-cost]', panelEl).textContent = UPSCALE_COST[ratio];
    const btn = $('.ic-generate-btn', panelEl);
    btn.disabled = state.submitting;
    btn.classList.toggle('is-loading', state.submitting);
    $('[data-action="hd"]', topbarEl).classList.toggle('is-active', !state.panelHidden);
  };

  const mountInline = () => {
    const node = getSelected();
    if (!node || node.status !== 'done') {
      toggleInline(topbarEl, false);
      toggleInline(panelEl, false);
      return;
    }
    if (topbarEl.parentElement !== node.el) {
      topbarEl.classList.remove('is-visible');
      panelEl.classList.remove('is-visible');
      node.el.append(topbarEl, panelEl);
    }
    syncPanel();
    toggleInline(topbarEl, true);
    toggleInline(panelEl, !state.panelHidden);
  };

  const select = (id) => {
    if (state.selectedId !== id) state.panelHidden = false;
    state.selectedId = id;
    state.nodes.forEach((n) => n.el.classList.toggle('is-selected', n.id === id));
    mountInline();
    renderLines();
  };

  /* ---------- 高清放大 ---------- */
  const overlaps = (x, y, w, h) =>
    state.nodes.some((n) => x < n.x + n.w + 40 && x + w + 40 > n.x && y - 28 < n.y + n.h + 40 && y + h + 40 > n.y - 28);

  const findResultSlot = (source) => {
    const x = source.x + source.w + 140;
    let y = source.y;
    while (overlaps(x, y, source.w, source.h)) y += source.h + 68;
    return { x, y };
  };

  const runUpscale = (node) => {
    const total = UPSCALE_SECONDS[node.params.ratio];
    const card = $('.ic-node-card', node.el);
    const loading = document.createElement('div');
    loading.className = 'ic-loading';
    loading.style.setProperty('--ic-loading-duration', `${total}s`);
    loading.style.setProperty('--ic-card-w', `${node.w}px`);
    loading.innerHTML = `
      <img class="ic-loading-cover" alt="">
      <div class="ic-loading-mask"></div>
      <div class="ic-loading-progress"><div class="ic-loading-gradient"></div><div class="ic-loading-sweep"></div></div>
      <div class="ic-loading-countdown">${total}s</div>`;
    $('.ic-loading-cover', loading).src = node.src;
    card.appendChild(loading);

    let left = total;
    const countdown = $('.ic-loading-countdown', loading);
    const timer = setInterval(() => {
      left -= 1;
      if (left > 0) countdown.textContent = `${left}s`;
      else countdown.remove();
    }, 1000);

    setTimeout(() => {
      clearInterval(timer);
      node.status = 'done';
      $('.ic-node-img', node.el).classList.add('is-revealing');
      loading.classList.add('is-leaving');
      setTimeout(() => loading.remove(), 320);
      renderLines();
      if (state.selectedId === node.id) mountInline();
      toast('success', `高清放大完成（${node.params.ratio}x${node.params.face ? '，已保留面部细节' : ''}）`);
    }, total * 1000);
  };

  const submitUpscale = (source) => {
    if (state.submitting) return;
    state.submitting = true;
    syncPanel();
    const params = { ...source.upscale };
    setTimeout(() => {
      state.submitting = false;
      const slot = findResultSlot(source);
      const result = addNode({
        title: `图片高清 · ${params.ratio}x`,
        x: slot.x,
        y: slot.y,
        w: source.w,
        h: source.h,
        src: source.src,
        ports: { in: true, out: true },
        status: 'loading',
        params,
      });
      state.lines.push({ from: source.id, to: result.id });
      select(null);
      revealNode(result);
      runUpscale(result);
    }, 600);
  };

  /* ---------- 事件 ---------- */
  [topbarEl, panelEl].forEach((el) => {
    el.addEventListener('pointerdown', (e) => e.stopPropagation());
    el.addEventListener('dblclick', (e) => e.stopPropagation());
  });

  panelEl.addEventListener('click', (e) => {
    const node = getSelected();
    if (!node) return;
    const option = e.target.closest('.ic-option');
    if (option && !option.disabled) {
      node.upscale.ratio = Number(option.dataset.ratio);
      syncPanel();
      return;
    }
    const sw = e.target.closest('.ic-switch');
    if (sw && !sw.disabled) {
      node.upscale.face = !node.upscale.face;
      syncPanel();
      return;
    }
    const btn = e.target.closest('.ic-generate-btn');
    if (btn && !btn.disabled) submitUpscale(node);
  });

  topbarEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    if (btn.dataset.action === 'hd') {
      state.panelHidden = !state.panelHidden;
      mountInline();
      return;
    }
    toast('info', `「${btn.dataset.label}」不在本次原型范围`);
  });

  document.querySelectorAll('[data-noop]').forEach((btn) =>
    btn.addEventListener('click', () => toast('info', `「${btn.dataset.noop}」不在本次原型范围`)),
  );

  document.querySelectorAll('[data-view]').forEach((btn) =>
    btn.addEventListener('click', () => {
      const action = btn.dataset.view;
      if (action === 'fit') return fitView();
      const step = action === 'zoom-in' ? 0.1 : -0.1;
      animateView(() => zoomAt(Math.round((state.zoom + step) * 10) / 10, innerWidth / 2, innerHeight / 2));
    }),
  );

  let drag = null;
  canvas.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    const nodeEl = e.target.closest('.ic-node');
    if (nodeEl) {
      const node = getNode(nodeEl.dataset.id);
      drag = { type: 'node', node, sx: e.clientX, sy: e.clientY, ox: node.x, oy: node.y, moved: false };
    } else {
      drag = { type: 'pan', sx: e.clientX, sy: e.clientY, ox: state.pan.x, oy: state.pan.y, moved: false };
    }
    try {
      canvas.setPointerCapture(e.pointerId);
    } catch (err) {
      /* 合成事件无 active pointer，忽略 */
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.sx;
    const dy = e.clientY - drag.sy;
    if (!drag.moved) {
      if (Math.hypot(dx, dy) < 3) return;
      drag.moved = true;
      if (drag.type === 'node') select(drag.node.id);
      else canvas.classList.add('is-panning');
    }
    if (drag.type === 'node') {
      drag.node.x = drag.ox + dx / state.zoom;
      drag.node.y = drag.oy + dy / state.zoom;
      placeNode(drag.node);
      renderLines();
    } else {
      state.pan.x = drag.ox + dx;
      state.pan.y = drag.oy + dy;
      applyView();
    }
  });

  const endDrag = () => {
    if (!drag) return;
    if (!drag.moved) select(drag.type === 'node' ? drag.node.id : null);
    canvas.classList.remove('is-panning');
    drag = null;
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  canvas.addEventListener(
    'wheel',
    (e) => {
      e.preventDefault();
      if (e.ctrlKey || e.metaKey) {
        zoomAt(state.zoom * Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
      } else {
        state.pan.x -= e.deltaX;
        state.pan.y -= e.deltaY;
      }
      applyView();
    },
    { passive: false },
  );

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') select(null);
  });

  /* ---------- 初始化 ---------- */
  const main = addNode({ title: '图片节点', x: 0, y: 0, w: 300, h: 300, src: IMAGES.kiwi });
  addNode({ title: '图片节点', x: -420, y: 110, w: 360, h: 201, src: IMAGES.glass });

  const TOOLBAR_RESERVE = 82;
  state.pan.x = TOOLBAR_RESERVE + (innerWidth - TOOLBAR_RESERVE) / 2 - main.w / 2;
  state.pan.y = Math.max(110, innerHeight / 2 - 195);
  applyView();
  renderLines();
  setTimeout(() => select(main.id), 350);
})();
</script>
</body>
</html>
